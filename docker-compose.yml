version: "3.8"

services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FORGE_ENV=production
      - LOG_LEVEL=INFO
      - AI_UNIVERSE_URL=http://ai-universe:8000
      - AI_UNIVERSE_API_KEY=friday_universe_api
      - API_KEY_REQUIRED=false
    volumes:
      - forge_data:/app/data
      - forge_workspaces:/app/workspaces
      - forge_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  forge_data:
  forge_workspaces:
  forge_artifacts:
