services:
  - type: web
    name: friday-forge
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: INTELX_URL
        sync: false
      - key: INFERENCE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: INTELX_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: FORGE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORTEX_URL
        sync: false
      - key: FUTURIS_URL
        sync: false
      - key: FUTURIS_API_KEY
        sync: false
      - key: CORTEX_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: INFERENCE_API_KEY
        sync: false
