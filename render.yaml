services:
  - type: web
    name: forge
    env: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: FORGE_ENV
        value: "production"
      - key: DATA_DIR
        value: "/app/data"
      - key: DATABASE_PATH
        value: "/app/data/forge.db"
      - key: WORKSPACES_DIR
        value: "/app/workspaces"
      - key: ARTIFACTS_DIR
        value: "/app/artifacts"
      - key: DEFAULT_PROVIDER
        value: "direct"
      - key: DEFAULT_MODEL
        value: "direct-default"
      - key: FORGE_API_KEY
        value: "forge_api"
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        value: "friday_api"
      - key: INFERENCE_URL
        value: "https://inference-r1sn.onrender.com"
      - key: INFERENCE_API_KEY
        value: "inference_api"
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        value: "stratex_api"
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        value: "memora_api"
      - key: INTELX_URL
        value: "https://intelx-mygl.onrender.com"
      - key: INTELX_API_KEY
        value: "intelx_api"
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        value: "futuris_api"
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        value: "cortex_api"
      - key: SENTINEL_URL
        value: "http://localhost:8003"
      - key: SENTINEL_API_KEY
        value: "sentinel_api"
