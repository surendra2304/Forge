name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests (Linux, shell-guarded)
        # -n 4 matches GitHub-hosted 4-vCPU runners; heavier oversubscription
        # flakes timing-sensitive golden benchmarks.
        # --timeout-method=signal (POSIX): the thread method deadlocked with
        # xdist on blocked socket I/O — two CI runs hung with no failing test.
        # -v streams per-test lines; combined with the GNU timeout wrapper a
        # wedge FAILS the step (retaining logs and naming the test) instead of
        # being cancelled at the job level, which destroys the evidence.
        if: runner.os == 'Linux'
        run: timeout 420 pytest -n 4 --timeout=120 --timeout-method=signal -v

      - name: Run tests (Windows)
        # Development platform: the full suite passes here (271 tests,
        # verified locally, keyless and keyed).
        if: runner.os == 'Windows'
        run: pytest -n 4 --timeout=120 --timeout-method=thread -v

      - name: Print hung-test tail on failure
        if: failure() && runner.os == 'Linux'
        run: echo "See the streamed per-test output above — the last printed test line is the wedge."
