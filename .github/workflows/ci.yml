name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Import check (Linux)
        # The 7 GB ubuntu runner OOM-killed pytest even serially (exit 137,
        # three runs of retained-log evidence). Until a larger free Linux
        # runner exists, Linux gates imports/lint; the full test gate runs on
        # windows (16 GB), which completes the suite in ~65s.
        if: runner.os == 'Linux'
        run: python -c "import app.main, app.core.orchestrator, app.verification.engine; print('core imports OK')"

      - name: Run tests (Windows, full gate)
        # Development platform and the runner with enough memory for the
        # suite; failures here are real and get fixed, not skipped.
        if: runner.os == 'Windows'
        run: python -m pytest -n 2 --timeout=120 --timeout-method=thread -v
