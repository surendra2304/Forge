name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        # -n 4 matches GitHub-hosted 4-vCPU runners; heavier oversubscription
        # flakes timing-sensitive golden benchmarks.
        # --timeout-method=signal: the thread method deadlocks with xdist when
        # a worker wedges on blocked socket I/O (observed: two CI runs hung
        # past the job timeout with no failing test). SIGALRM interrupts the
        # hang and fails the offending test; signal is POSIX-only, which CI
        # (ubuntu) satisfies.
        # -v streams per-test lines so a CI-only hang names its test live.
        run: pytest -n 4 --timeout=120 --timeout-method=signal -v
