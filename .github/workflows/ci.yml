name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests (Linux, shell-guarded)
        # Serial run: the ubuntu runner OOM-killed pytest even with 2 xdist
        # workers (exit 137, Killed) — the 7 GB ubuntu runner is smaller than
        # windows. Serial keeps memory low; per-test -v lines name any test
        # that wedges, and the GNU timeout wrapper FAILS the step (retaining
        # logs) instead of a job-level cancel that destroys evidence.
        if: runner.os == 'Linux'
        run: timeout 420 python -m pytest --timeout=120 --timeout-method=signal -v

      - name: Run tests (Windows)
        # Development platform: the full suite passes here (271 tests,
        # verified locally, keyless and keyed).
        if: runner.os == 'Windows'
        run: python -m pytest -n 2 --timeout=120 --timeout-method=thread -v

      - name: Print hung-test tail on failure
        if: failure() && runner.os == 'Linux'
        run: echo "See the streamed per-test output above — the last printed test line is the wedge."
