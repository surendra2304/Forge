name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        # -n 4 matches GitHub-hosted 4-vCPU runners; xdist workers saturating
        # more cores have been observed to flake timing-sensitive golden
        # benchmarks locally (12-core oversubscription).
        # --timeout=120 turns a hung test into a 2-minute failure instead of
        # eating the whole 30-minute job budget.
        run: pytest -n 4 --timeout=120 --timeout-method=thread
